server.port=8080

spring.application.name=api-gateway

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Routes
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.routes[1].id=account-service
spring.cloud.gateway.routes[1].uri=lb://account-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/accounts/**, /api/v1/banks

spring.cloud.gateway.routes[2].id=transaction-service
spring.cloud.gateway.routes[2].uri=lb://transaction-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/transactions/**, /api/v1/securehold/**, /api/v1/transfer

spring.cloud.gateway.routes[3].id=dispute-service
spring.cloud.gateway.routes[3].uri=lb://dispute-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/disputes/**

spring.cloud.gateway.routes[4].id=openapi-auth
spring.cloud.gateway.routes[4].uri=lb://auth-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/v3/api-docs/auth-service
spring.cloud.gateway.routes[4].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.routes[5].id=openapi-account
spring.cloud.gateway.routes[5].uri=lb://account-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/v3/api-docs/account-service
spring.cloud.gateway.routes[5].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.routes[6].id=openapi-transaction
spring.cloud.gateway.routes[6].uri=lb://transaction-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/v3/api-docs/transaction-service
spring.cloud.gateway.routes[6].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.routes[7].id=openapi-dispute
spring.cloud.gateway.routes[7].uri=lb://dispute-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/v3/api-docs/dispute-service
spring.cloud.gateway.routes[7].filters[0]=SetPath=/v3/api-docs

# CORS Configuration
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins[0]=http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[0]=GET
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[1]=POST
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[2]=PUT
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[3]=DELETE
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[4]=PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[5]=OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=500ms

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.registry-fetch-interval-seconds=5

# Swagger UI Configurations
springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/v3/api-docs/auth-service
springdoc.swagger-ui.urls[1].name=Account Service
springdoc.swagger-ui.urls[1].url=/v3/api-docs/account-service
springdoc.swagger-ui.urls[2].name=Transaction Service
springdoc.swagger-ui.urls[2].url=/v3/api-docs/transaction-service
springdoc.swagger-ui.urls[3].name=Dispute Service
springdoc.swagger-ui.urls[3].url=/v3/api-docs/dispute-service

# Custom configurations for local development resilience
prymo.auth.use-mock-jwt=true
prymo.auth.secret-key=PrymoSecureHoldBankingBackendJWTSecretSuperSecretKey123PrymoSecureHoldBankingBackendJWTSecretSuperSecretKey123

# Centralized Observability (Actuator, Prometheus, Zipkin Tracing)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
