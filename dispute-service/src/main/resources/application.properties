server.port=8084

spring.application.name=dispute-service

# Default local profile: H2 Database
spring.datasource.url=jdbc:h2:mem:disputedb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=password
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Kafka configurations (resilient to connection failure)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=dispute-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

#---
# Production Profile: PostgreSQL
spring.config.activate.on-profile=prod
spring.datasource.url=jdbc:postgresql://postgres:5432/prymo_dispute_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.kafka.bootstrap-servers=kafka:29092
